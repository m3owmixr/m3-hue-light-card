# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  # PRs target m3-restyle (not the default branch) so main can keep
  # fast-forwarding from m3-restyle at release time.
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'm3-restyle'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'ci'

  # Maintain dependencies for npm
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    target-branch: 'm3-restyle'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'build'
      prefix-development: 'chore'
      include: 'scope'
    open-pull-requests-limit: 5
    groups:
      # All minor/patch bumps to build and test tooling arrive as one PR.
      # Major bumps still get their own PR so a breaking change is easy to spot.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
