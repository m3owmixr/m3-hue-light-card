name: Validation
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: ⏬ Checkout
      uses: actions/checkout@v6
    - name: ⚙️ Install Node
      uses: actions/setup-node@v6
    - name: 📦 Install modules
      run: npm ci
    - name: 🖊️ Linter
      run: npm run lint
    - name: 🔨 Build
      run: npm run rollup
    - name: 🥼 Tests
      run: npm run test
    - name: 👁️ HACS validation
      uses: hacs/action@22.5.0
      with:
        category: 'plugin'
      # The fork has no releases yet, so HACS can't find m3-hue-light-card.js on dev branches.
      # Only validate main; the first release (step 6) makes this check pass.
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'